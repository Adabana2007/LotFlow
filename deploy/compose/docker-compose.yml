name: lotflow

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: lotflow
      POSTGRES_USER: ${DB_USERNAME:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-1234}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - type: bind
        source: ../../data/pgsql
        target: /var/lib/postgresql
      - type: bind
        source: ../../backend/src/main/resources/db/init.sql
        target: /docker-entrypoint-initdb.d/001-init.sql
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-root} -d lotflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.10.2
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "6379:6379"
    volumes:
      - ../../data/redis:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user root --pass 1234 ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.3.6-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-root}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-1234}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ../../data/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir /etcd
    volumes:
      - ../../data/etcd:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 20

  milvus-minio:
    image: ${MILVUS_MINIO_IMAGE:-minio/minio:RELEASE.2024-12-18T13-15-44Z}
    environment:
      MINIO_ROOT_USER: ${MILVUS_MINIO_ACCESS_KEY:-root}
      MINIO_ROOT_PASSWORD: ${MILVUS_MINIO_SECRET_KEY:-root1234}
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ../../data/milvus-minio:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20

  milvus:
    image: milvusdb/milvus:v3.0.3
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MINIO_ACCESS_KEY_ID: ${MILVUS_MINIO_ACCESS_KEY:-root}
      MINIO_SECRET_ACCESS_KEY: ${MILVUS_MINIO_SECRET_KEY:-root1234}
      MINIO_BUCKET_NAME: ${MILVUS_MINIO_BUCKET:-milvus-bucket}
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - ../../data/milvus:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30


